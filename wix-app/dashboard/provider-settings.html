<style>
  :root {
    color-scheme: light;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #241b31;
    background: #f7f9fa;
  }
  * { box-sizing: border-box; }
  .provider-settings {
    width: min(680px, calc(100% - 32px));
    margin: 32px auto;
    padding: clamp(24px, 5vw, 42px);
    border: 1px solid #d4dbe1;
    border-top: 4px solid #126eaa;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 12px 34px rgba(25, 37, 47, .12);
  }
  .provider-settings h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.025em; line-height: 1.15; }
  .provider-settings > p { color: #465866; line-height: 1.55; }
  #provider-key-form { display: grid; gap: 9px; margin-top: 28px; }
  #provider-key-form label { font-weight: 750; }
  #provider-key {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 1px solid #8998a5;
    border-radius: 5px;
    font: inherit;
  }
  #provider-key:hover,
  #provider-key:focus { border-color: #126eaa; }
  #provider-key:focus-visible,
  #provider-key-form button:focus-visible { outline: 3px solid #f2b705; outline-offset: 3px; }
  #provider-key-form button {
    min-height: 48px;
    justify-self: start;
    margin-top: 4px;
    padding: 10px 16px;
    border: 1px solid #0d4f7d;
    border-radius: 5px;
    color: #fff;
    background: #0d4f7d;
    cursor: pointer;
    font: inherit;
    font-weight: 750;
  }
  #provider-key-form button:hover { background: #083e63; }
  #provider-key-status {
    min-height: 26px;
    margin: 20px 0 0;
    padding: 12px 14px;
    border-radius: 5px;
    background: #edf6fb;
    font-size: 15px;
  }
</style>

<section class="provider-settings" aria-labelledby="provider-settings-title">
  <h1 id="provider-settings-title">Digital Equity guide provider</h1>
  <p>
    Add the Ollama Cloud key that this site will use for source selection.
    Wix stores the key in Secrets Manager, and site visitors never receive it.
  </p>

  <form id="provider-key-form">
    <label for="provider-key">Ollama Cloud API key</label>
    <input
      id="provider-key"
      name="provider-key"
      type="password"
      autocomplete="new-password"
      minlength="12"
      maxlength="3500"
      required
    >
    <button type="submit">Save key securely</button>
  </form>

  <p id="provider-key-status" role="status" aria-live="polite">
    Checking this site's configuration…
  </p>
</section>

<script type="module" src="./provider-settings.js"></script>
