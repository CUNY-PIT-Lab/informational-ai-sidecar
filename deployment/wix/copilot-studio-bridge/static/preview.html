<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wix embed preview</title>
    <link rel="stylesheet" href="/static/preview.css">
  </head>
  <body>
    <main>
      <h1>Wix embed preview</h1>
      <p>The outer page represents Wix. The framed widget runs on its own origin.</p>
      <iframe
        src="/embed"
        title="Fortune Society information guide"
        sandbox="allow-scripts allow-forms allow-same-origin"
        referrerpolicy="no-referrer"
      ></iframe>
    </main>
  </body>
</html>
